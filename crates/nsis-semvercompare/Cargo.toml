[package]
name = "nsis-semvercompare"
version = "0.4.1"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lib]
crate-type = [ "cdylib" ]

[features]
default = ["unicode"]
unicode = ["nsis-plugin/unicode"]
ansi = ["nsis-plugin/ansi"]

[dependencies]
semver = { version = "1.0", default-features = false }
nsis-plugin = { workspace = true }

[dev-dependencies]
nsis-plugin = { workspace = true, features = ["testing"] }
