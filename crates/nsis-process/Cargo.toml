[package]
name = "nsis-process"
version = "0.5.0"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lib]
crate-type = [ "cdylib" ]

[features]
default = ["unicode"]
unicode = ["nsis-plugin/unicode"]
ansi = ["nsis-plugin/ansi"]

[dependencies]
nsis-plugin = { workspace = true }
windows-sys = { workspace = true }

[dev-dependencies]
nsis-plugin = { workspace = true, features = ["testing"] }
